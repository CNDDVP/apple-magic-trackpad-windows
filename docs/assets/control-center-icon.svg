<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Magic Trackpad Control Center</title>
  <desc id="desc">A silver trackpad with a curved green gesture on an emerald rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#28ad8b"/>
      <stop offset=".52" stop-color="#118466"/>
      <stop offset="1" stop-color="#155748"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".65" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f4faf7"/>
      <stop offset="1" stop-color="#d8e9e2"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d0e1d9"/>
      <stop offset="1" stop-color="#94b9a9"/>
    </linearGradient>
    <linearGradient id="gesture" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#41bf99"/>
      <stop offset="1" stop-color="#147f62"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="170%" height="200%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#073e30" flood-opacity=".33"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="17" y="17" width="222" height="222" rx="51" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
  <g transform="rotate(-11 128 132)" filter="url(#shadow)">
    <rect x="43" y="74" width="170" height="126" rx="20" fill="url(#edge)"/>
    <rect x="43" y="67" width="170" height="126" rx="20" fill="url(#glass)" stroke="#e0eee7" stroke-width="1.5"/>
    <path d="M65 72H191" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M88 153C100 122 122 111 163 111" fill="none" stroke="#d6efe4" stroke-width="22" stroke-linecap="round"/>
    <path d="M88 153C100 122 122 111 163 111M151 98L165 111L151 124" fill="none" stroke="url(#gesture)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="88" cy="153" r="10" fill="#ffffff" stroke="#2ca582" stroke-width="5"/>
  </g>
</svg>
