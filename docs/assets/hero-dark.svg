<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
<title id="title">Apple Magic Trackpad Windows Suite</title>
<desc id="desc">Apple Magic Trackpad Windows Suite banner showing a silver multi-touch trackpad, hardware ScanTime S-curve trajectory, and Force Click preview badge for Windows 11.</desc>
