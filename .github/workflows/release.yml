name: Package release assets
on:
  push:
    branches: [main]
    paths: [RELEASE_VERSION]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify and publish
        required: true
        default: v1.2.0
permissions:
  contents: read
jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      - name: Resolve and validate release version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $version = (Get-Content -LiteralPath RELEASE_VERSION -Raw).Trim()
          $tag = $env:REQUESTED_TAG
          if (-not $tag) { $tag = $version }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $tag -ne $version) { throw 'Invalid or mismatched release version.' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Build and run behavior and integration tests
        shell: powershell
        run: .\Build.ps1
      - name: Compile control center and test configuration behavior
        shell: powershell
        run: .\Build-ControlCenter.ps1 -OutputDir artifacts/control-center
      - name: Test suite upgrade and rollback
        shell: powershell
        run: |
          .\tests\Test-SuiteUpgrade.ps1 | Tee-Object artifacts/SuiteUpgradeResults.txt
          python -c "import pathlib,subprocess; p=pathlib.Path('artifacts/baseline'); p.mkdir(exist_ok=True); (p/'MagicForceClick.exe').write_bytes(subprocess.check_output(['git','show','fc364b2d53f9a177f2e366ab8d639506298cb283:MagicForceClick.exe']))"
          .\tests\Test-UpdateRollback.ps1 | Tee-Object artifacts/UpdateRollbackResults.txt
      - name: Verify checksums and build release packages
        if: success()
        run: python tools/Package_Release.py
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Join-Path 'artifacts/release' $env:RELEASE_TAG
          $notes = 'RELEASE_NOTES_' + $env:RELEASE_TAG + '.md'
          $repo = $env:GITHUB_REPOSITORY
          $existing = gh api "repos/$repo/releases/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $repo --target $env:GITHUB_SHA --title ('Magic Trackpad Windows Suite ' + $env:RELEASE_TAG) --notes-file $notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          }
          $release = gh api "repos/$repo/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          foreach ($file in Get-ChildItem -LiteralPath $assets -File) {
            $previous = @($release.assets | Where-Object name -eq $file.Name)
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            if ($previous.Count) {
              if ($previous[0].digest -ne $digest) { throw "Published asset differs; refusing overwrite: $($file.Name)" }
            } else {
              if (-not $release.draft) { throw 'Incomplete published release; manual review required.' }
              gh release upload $env:RELEASE_TAG $file.FullName --repo $repo
              if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed.' }
            }
          }
          $verified = gh api "repos/$repo/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          foreach ($file in Get-ChildItem -LiteralPath $assets -File) {
            $asset = @($verified.assets | Where-Object name -eq $file.Name)
            if ($asset.Count -ne 1 -or $asset[0].digest -ne ('sha256:' + (Get-FileHash -LiteralPath $file.FullName).Hash.ToLowerInvariant())) { throw 'Uploaded asset digest mismatch.' }
          }
          if ($verified.draft) {
            gh release edit $env:RELEASE_TAG --repo $repo --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Publishing verified release failed.' }
          }
      - name: Retain verified package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MagicTrackpad-release-packages
          path: artifacts/release/
