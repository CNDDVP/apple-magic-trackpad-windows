name: Build and behavior tests
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test
        shell: powershell
        run: .\Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MagicForceClick-tested-build
          path: artifacts/
